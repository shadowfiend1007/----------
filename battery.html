<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Elements</title>
    <style>
        .battery {
            border: 2px solid darkgray;
            width: 150px;
            height: 40px;
        }
    </style>
</head>
<body>
    <h1>Псевдоелементи</h1>
    <p>
        Окрім псевдокласів які задають в різному стані елементів 
        існують псевдоелементи які дозволяють розширювати будову 
        даного елементу. 
    </p>
     <div class="battery"></div>
</body>
</html>
